name: Deploy the sun

on:
  push:
    branches: [main]
    paths:
      - 'simulator/**'
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  droplet:
    name: Sync to droplet and restart
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DROPLET_HOST }}
      USER: ${{ secrets.DROPLET_USER || 'root' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          ok=1
          [ -n "$HOST" ] || { echo "::error::Secret DROPLET_HOST is empty or missing (repo → Settings → Secrets and variables → Actions)"; ok=0; }
          [ -n "$KEY" ] || { echo "::error::Secret DROPLET_SSH_KEY is empty or missing"; ok=0; }
          case "$KEY" in *"BEGIN OPENSSH PRIVATE KEY"*) ;; *) [ -z "$KEY" ] || { echo "::error::DROPLET_SSH_KEY does not look like a private key (it must start with -----BEGIN OPENSSH PRIVATE KEY-----)"; ok=0; };; esac
          [ $ok = 1 ] || exit 1
          echo "secrets present · host $HOST · user $USER"

      - name: Install SSH key
        env:
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || { echo "::error::Cannot reach $HOST on port 22 — droplet off, wrong IP, or firewall"; exit 1; }

      - name: Test login
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=15 "$USER@$HOST" 'echo "logged in as $(whoami) on $(hostname)"' \
            || { echo "::error::SSH login refused — the deploy public key is not in /root/.ssh/authorized_keys on the droplet. Run the ssh root@IP '...>> authorized_keys' command from the setup steps."; exit 1; }

      - name: Sync files
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy" \
            --exclude 'server/.env' --exclude 'server/data' --exclude 'server/node_modules' \
            simulator server "$USER@$HOST:/opt/the-sun/"

      - name: Rebuild and restart
        run: |
          ssh -i ~/.ssh/deploy "$USER@$HOST" 'cd /opt/the-sun/server && test -f .env || { echo "server/.env missing on the droplet — run deploy.sh once from your Mac first"; exit 1; }; docker compose up -d --build --remove-orphans && docker image prune -f >/dev/null && docker compose ps'

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS --max-time 20 "http://$HOST/api/health" || curl -fsS --max-time 20 -k "https://$HOST/api/health"

  pages:
    name: Update gh-pages copy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Split simulator/ into gh-pages and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          SHA=$(git subtree split --prefix=simulator main)
          git push --force origin "$SHA:refs/heads/gh-pages"
