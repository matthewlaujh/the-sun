; gateway_rig_test — Olimex ESP32-GATEWAY → PixLite E4-S Mk3 (Expanded) → the whole sun (2,417 px, 8 runs, 23 universes)
; arduino-esp32 core 3.x via the pioarduino platform (the stock "espressif32" platform is stuck on core 2.x)
;
;   pio run -e usb -e ota        ONCE, WITH INTERNET: compiles both envs so every package and library is cached locally
;                                (PlatformIO keeps a separate .pio/libdeps/<env>/ per environment — building only usb
;                                would leave ota trying to download on first use). Joined to SUN-DISC there is NO internet.
;   pio run -e usb -t upload     first flash / rescue, over the GATEWAY's micro-USB (CH340)
;   pio run -e ota -t upload     afterwards: join Wi-Fi SUN-DISC on the laptop, upload over the air to 192.168.4.1 — fully offline
;   pio device monitor           115200 baud (USB only)

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-gateway
framework = arduino
monitor_speed = 115200
; Page theme: -DUI_DARK=1 → dark, -DUI_DARK=0 (or omitted) → light. The header pill shows "build <date time> · light|dark".
; Quick OTA test: flash one theme, flip the flag below (or run  PLATFORMIO_BUILD_FLAGS=-DUI_DARK=1 pio run -e ota -t upload ), reload the page.
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DUI_DARK=0
; -DSINGLE_CORE_RENDER            ; uncomment to render on core 1 only (no helper on the Wi-Fi core); heavy scenes drop to ~18 fps
extra_scripts = pre:tools/gen_html_gz.py   ; gzips src/index_html.h → src/index_html_gz.h before every build (stdlib only)
board_build.partitions = min_spiffs.csv   ; 4 MB flash → two 1.9 MB OTA app slots (we use no SPIFFS)
lib_deps =
  ESP32Async/ESPAsyncWebServer @ ^3.12
  ESP32Async/AsyncTCP @ ^3.5

[env:usb]
upload_speed = 460800                    ; CH340 on the GATEWAY is flaky at 921600; hold BUT1 during "Connecting" if needed

[env:ota]
upload_protocol = espota
upload_port = 192.168.4.1                ; the ESP's own AP address — the laptop must be joined to SUN-DISC
upload_flags =
  --port=3232
  --auth=sunshine26-ota                  ; must match OTA_PASS in src/main.cpp
