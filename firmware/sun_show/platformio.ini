; sun_show — Olimex ESP32-GATEWAY → PixLite E4-S Mk3 (Expanded) → the whole sun (2,417 px, 8 runs, 23 universes). No web page.
;
;   pio run -t upload              over the GATEWAY's micro-USB (CH340) — no Wi-Fi / OTA in this firmware
;   pio device monitor             115200 baud

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-gateway
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
board_build.partitions = min_spiffs.csv   ; 4 MB flash, 1.9 MB app slot

[env:usb]
upload_speed = 460800                    ; CH340 on the GATEWAY is flaky at 921600; hold BUT1 during "Connecting" if needed
