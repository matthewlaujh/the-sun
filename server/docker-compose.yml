services:
  app:
    build: { context: .., dockerfile: server/Dockerfile }
    restart: unless-stopped
    environment:
      - SUN_ADMIN_KEY=${SUN_ADMIN_KEY:?set SUN_ADMIN_KEY in server/.env}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes: [ "sun-data:/data" ]
    expose: [ "8080" ]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    environment: [ "DOMAIN=${DOMAIN:-:80}" ]
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config" ]
    depends_on: [ app ]
volumes: { sun-data: {}, caddy-data: {}, caddy-config: {} }
